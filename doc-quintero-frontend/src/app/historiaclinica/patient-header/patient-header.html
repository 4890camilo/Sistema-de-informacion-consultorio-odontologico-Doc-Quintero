<div class="patient-header-container" *ngIf="patient">
  <div class="patient-main-banner">
    <div class="patient-profile">
      <div class="patient-avatar-box">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>

      <div class="patient-details">
        <h2 class="patient-name">{{ patient.fullName }}</h2>
        <div class="patient-meta">
          <span>CC {{ patient.identificationNumber }}</span>
          <span class="dot">•</span>
          <span>Edad: {{ patient.ageYears }} años</span>
        </div>
        <div class="patient-agreement">{{ patient.agreement || 'Sin convenio especial' }}</div>
      </div>
    </div>

    <div class="patient-quick-cards">
      <div class="quick-card alerts">
        <div class="card-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 3.4L20.1 19H3.9L12 5.4zM11 10h2v4h-2zm0 5h2v2h-2z"/></svg>
          Alertas Médicas
        </div>
        <div class="card-content">
          <span *ngIf="!patient.medicalAlerts || patient.medicalAlerts.length === 0" class="empty">Ninguna</span>
          <span *ngFor="let item of patient.medicalAlerts" class="tag alert-tag">{{ item }}</span>
        </div>
      </div>

      <div class="quick-card diseases">
        <div class="card-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          Enfermedades
        </div>
        <div class="card-content">
          <span *ngIf="!patient.diseases || patient.diseases.length === 0" class="empty">Ninguna</span>
          <span *ngFor="let item of patient.diseases" class="tag">{{ item }}</span>
        </div>
      </div>

      <div class="quick-card meds">
        <div class="card-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 10.5C3.67 10.5 3 11.17 3 12s.67 1.5 1.5 1.5h15c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5h-15z"/></svg>
          Medicamentos
        </div>
        <div class="card-content">
          <span *ngIf="!patient.medications || patient.medications.length === 0" class="empty">Ninguno</span>
          <span *ngFor="let item of patient.medications" class="tag">{{ item }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
