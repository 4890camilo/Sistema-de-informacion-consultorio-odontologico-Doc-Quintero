<div class="page-container">
  <div class="page-header">
    <div class="page-header-text">
      <h1>Nueva Historia Clínica</h1>
      <p>Paciente: {{ patient?.firstName }} {{ patient?.lastName }}</p>
    </div>
  </div>

  <!-- Medical Alerts Banner (Visible if any) -->
  <div class="alert-banner" *ngIf="historyForm.get('anamnesis.alertasMedicas')?.value">
    <div class="alert-banner-content">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 18c-.77 1.333.192 3 1.732 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>ALERTA MÉDICA: {{ historyForm.get('anamnesis.alertasMedicas')?.value }}</span>
    </div>
  </div>

  <div class="form-container">
    <form [formGroup]="historyForm" (ngSubmit)="onSubmit()" class="clinical-form">
      
      <div formGroupName="anamnesis">
        <div class="form-section">
          <h3>Anamnesis / Motivo de Consulta</h3>
          <div class="field-group">
            <label>Motivo de Consulta *</label>
            <textarea formControlName="motivoConsulta" rows="2" placeholder="Describa brevemente el motivo de la visita"></textarea>
          </div>
        </div>

        <div class="form-section">
          <h3>Antecedentes Médicos Sistémicos</h3>
          <div class="enfermedades-grid">
            <label class="checkbox-item" *ngFor="let enf of ['Diabetes', 'Hipertensión', 'Cardiopatías', 'Epilepsia', 'VIH', 'Asma', 'Hepatitis']">
              <input type="checkbox" (change)="toggleEnfermedad(enf)">
              <span>{{ enf }}</span>
            </label>
          </div>
        </div>

        <div class="form-grid mt-4">
          <div class="field-group">
            <label>¿Tratamiento médico actual?</label>
            <div class="radio-group">
              <label><input type="radio" [value]="true" formControlName="enTratamientoMedico"> Sí</label>
              <label><input type="radio" [value]="false" formControlName="enTratamientoMedico"> No</label>
            </div>
          </div>
          <div class="field-group" *ngIf="historyForm.get('anamnesis.enTratamientoMedico')?.value">
            <label>Detalle del tratamiento</label>
            <input type="text" formControlName="detalleTratamiento">
          </div>
        </div>

        <div class="form-grid">
          <div class="field-group">
            <label>Medicamentos Actuales</label>
            <textarea formControlName="medicamentos" rows="2"></textarea>
          </div>
          <div class="field-group">
            <label>Alergias</label>
            <textarea formControlName="alergias" rows="2" placeholder="Medicamentos, alimentos, etc."></textarea>
          </div>
        </div>

        <div class="form-section">
          <h3>Alertas y Otros</h3>
          <div class="field-group highlight-field">
            <label>Alertas Médicas Críticas (Visibles en toda la ficha)</label>
            <input type="text" formControlName="alertasMedicas" placeholder="Ej: ALÉRGICO A LA PENICILINA">
          </div>
          <div class="form-grid mt-4">
            <div class="field-group">
              <label>¿Embarazo?</label>
              <select formControlName="embarazo">
                <option [value]="true">Sí</option>
                <option [value]="false">No</option>
              </select>
            </div>
            <div class="field-group">
              <label>Antecedentes Odontológicos</label>
              <input type="text" formControlName="antecedentesOdontologicos">
            </div>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoadingForm">
          <span *ngIf="!isLoadingForm">Guardar Historia Clínica</span>
          <span *ngIf="isLoadingForm" class="spinner"></span>
        </button>
      </div>
    </form>
  </div>
</div>
