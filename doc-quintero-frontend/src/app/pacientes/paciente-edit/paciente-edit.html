<div class="page-container">
  <div class="page-header">
    <div class="page-header-text">
      <h1>Editar Paciente</h1>
      <p>ID: {{ patientForm.get('identificationNumber')?.value }}</p>
    </div>
  </div>

  <div class="form-container">
    <div class="form-tabs">
      <button type="button" [class.active]="activeTab === 'basicos'" (click)="setTab('basicos')">Datos Básicos</button>
      <button type="button" [class.active]="activeTab === 'contacto'" (click)="setTab('contacto')">Contacto</button>
      <button type="button" [class.active]="activeTab === 'adicionales'" (click)="setTab('adicionales')">Adicionales</button>
      <button type="button" [class.active]="activeTab === 'acudiente'" (click)="setTab('acudiente')">Acudiente</button>
    </div>

    <form [formGroup]="patientForm" (ngSubmit)="onSubmit()" class="patient-form">
      
      <div class="alert alert-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Tab: Básicos -->
      <div class="tab-content" *ngIf="activeTab === 'basicos'">
        <div class="form-section">
          <h3>Identidad</h3>
          <div class="form-grid">
            <div class="field-group">
              <label>Tipo Documento *</label>
              <select formControlName="tipoDocumento">
                <option value="CC">Cédula de Ciudadanía</option>
                <option value="TI">Tarjeta de Identidad</option>
                <option value="CE">Cédula de Extranjería</option>
                <option value="PAS">Pasaporte</option>
              </select>
            </div>
            <div class="field-group">
              <label>Número de Identificación</label>
              <input type="text" formControlName="identificationNumber">
            </div>
            <div class="field-group">
              <label>Nombres *</label>
              <input type="text" formControlName="firstName">
            </div>
            <div class="field-group">
              <label>Apellidos *</label>
              <input type="text" formControlName="lastName">
            </div>
            <div class="field-group">
              <label>Nombre Social</label>
              <input type="text" formControlName="nombreSocial">
            </div>
            <div class="field-group">
              <label>Sexo</label>
              <select formControlName="sexo">
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
                <option value="Otro">Otro</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab: Contacto -->
      <div class="tab-content" *ngIf="activeTab === 'contacto'">
        <div class="form-section">
          <h3>Información de Contacto</h3>
          <div class="form-grid">
            <div class="field-group">
              <label>Teléfono Móvil *</label>
              <input type="tel" formControlName="phone">
            </div>
            <div class="field-group">
              <label>Teléfono Fijo</label>
              <input type="tel" formControlName="telefonoFijo">
            </div>
            <div class="field-group">
              <label>Correo Electrónico *</label>
              <input type="email" formControlName="email">
            </div>
            <div class="field-group">
              <label>Dirección</label>
              <input type="text" formControlName="address">
            </div>
            <div class="field-group">
              <label>Ciudad</label>
              <input type="text" formControlName="ciudad">
            </div>
            <div class="field-group">
              <label>Departamento</label>
              <input type="text" formControlName="departamento">
            </div>
          </div>
        </div>
      </div>

      <!-- Tab: Adicionales -->
      <div class="tab-content" *ngIf="activeTab === 'adicionales'">
        <div class="form-section">
          <h3>Datos Clínicos y Administrativos</h3>
          <div class="form-grid">
            <div class="field-group">
              <label>Ocupación</label>
              <input type="text" formControlName="ocupacion">
            </div>
            <div class="field-group">
              <label>EPS / Seguro / Convenio</label>
              <input type="text" formControlName="insurance">
            </div>
            <div class="field-group">
              <label>Tipo de Paciente</label>
              <select formControlName="tipoPaciente">
                <option value="Particular">Particular</option>
                <option value="Convenio">Convenio</option>
                <option value="Empleado">Empleado</option>
              </select>
            </div>
          </div>
          <div class="field-group mt-4">
            <label>Observaciones Generales</label>
            <textarea formControlName="observaciones" rows="3"></textarea>
          </div>
        </div>
      </div>

      <!-- Tab: Acudiente -->
      <div class="tab-content" *ngIf="activeTab === 'acudiente'" formGroupName="acudiente">
        <div class="form-section">
          <h3>Representante / Acudiente</h3>
          <div class="form-grid">
            <div class="field-group">
              <label>Nombre Completo</label>
              <input type="text" formControlName="nombre">
            </div>
            <div class="field-group">
              <label>Identificación</label>
              <input type="text" formControlName="identificacion">
            </div>
            <div class="field-group">
              <label>Parentesco</label>
              <input type="text" formControlName="parentesco">
            </div>
            <div class="field-group">
              <label>Teléfono</label>
              <input type="tel" formControlName="telefono">
            </div>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaving">
          <span *ngIf="!isSaving">Guardar Cambios</span>
          <span *ngIf="isSaving" class="spinner"></span>
        </button>
      </div>
    </form>
  </div>
</div>
