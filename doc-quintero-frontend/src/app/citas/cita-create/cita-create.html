<div class="page-container">
  <div class="page-header">
    <h1>Nueva Cita</h1>
    <p>Agenda una nueva cita para el paciente</p>
  </div>

  <div class="alert alert-success" *ngIf="successMessage">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M13.5 4.5L6 12L2.5 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    {{ successMessage }}
  </div>

  <div class="alert alert-error" *ngIf="errorMessage">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8 5v3.5M8 11h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    {{ errorMessage }}
  </div>

  <div class="loading-spinner" *ngIf="isLoadingPage">
    <div class="spinner"></div>
    <p>Cargando pacientes...</p>
  </div>

  <div class="form-card" *ngIf="!isLoadingPage">
    <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
      
      <div class="form-section">
        <h3>Información de la Cita</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="patientId">
              Paciente
              <span class="required">*</span>
            </label>
            <select 
              id="patientId" 
              formControlName="patientId"
              [class.has-error]="appointmentForm.get('patientId')?.touched && appointmentForm.get('patientId')?.invalid">
              <option value="">— Seleccionar paciente —</option>
              <option *ngFor="let patient of patients" [value]="patient.id">
                {{ patient.firstName }} {{ patient.lastName }} ({{ patient.identificationNumber }})
              </option>
            </select>
            <div class="error-message" *ngIf="appointmentForm.get('patientId')?.touched && appointmentForm.get('patientId')?.invalid">
              El paciente es requerido
            </div>
          </div>

          <div class="form-group">
            <label for="type">
              Tipo de Cita
              <span class="required">*</span>
            </label>
            <select 
              id="type" 
              formControlName="type"
              [class.has-error]="appointmentForm.get('type')?.touched && appointmentForm.get('type')?.invalid">
              <option value="">— Seleccionar tipo —</option>
              <option value="Consulta">Consulta General</option>
              <option value="Limpieza">Limpieza Dental</option>
              <option value="Extracción">Extracción</option>
              <option value="Tratamiento">Tratamiento de Conducto</option>
              <option value="Ortodoncia">Ortodoncia</option>
              <option value="Otro">Otro</option>
            </select>
            <div class="error-message" *ngIf="appointmentForm.get('type')?.touched && appointmentForm.get('type')?.invalid">
              El tipo de cita es requerido
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dateTime">
              Fecha y Hora
              <span class="required">*</span>
            </label>
            <input 
              type="datetime-local" 
              id="dateTime" 
              formControlName="dateTime"
              [class.has-error]="appointmentForm.get('dateTime')?.touched && appointmentForm.get('dateTime')?.invalid">
            <div class="error-message" *ngIf="appointmentForm.get('dateTime')?.touched && appointmentForm.get('dateTime')?.invalid">
              La fecha y hora son requeridas
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Notas Adicionales</h3>
        
        <div class="form-group">
          <label for="notes">Observaciones o notas especiales</label>
          <textarea 
            id="notes" 
            formControlName="notes"
            placeholder="Agrega cualquier información relevante para la cita..."
            rows="4"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="appointmentForm.invalid || isLoadingForm">
          <span *ngIf="!isLoadingForm">Agendar Cita</span>
          <span *ngIf="isLoadingForm">Agendando...</span>
        </button>
        <button 
          type="button" 
          class="btn btn-secondary"
          (click)="cancel()"
          [disabled]="isLoadingForm">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
