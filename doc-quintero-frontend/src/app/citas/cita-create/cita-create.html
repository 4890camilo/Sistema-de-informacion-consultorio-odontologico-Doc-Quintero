<div class="page-container">
  <div class="page-header">
    <div class="page-header-text">
      <h1>Agendar Cita</h1>
      <p>Gestión de Agenda - Consultorio Doc. Quintero</p>
    </div>
  </div>

  <div class="form-container">
    <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()" class="clinical-form">
      
      <div class="form-section">
        <h3>Información de la Cita</h3>
        <div class="form-grid">
          <div class="field-group">
            <label>Paciente *</label>
            <select formControlName="pacienteId">
              <option value="">Seleccione un paciente</option>
              <option *ngFor="let p of patients" [value]="p.id">
                {{ p.firstName }} {{ p.lastName }} ({{ p.identificationNumber }})
              </option>
            </select>
          </div>
          <div class="field-group">
            <label>Fecha y Hora *</label>
            <input type="datetime-local" formControlName="fechaHora">
          </div>
          <div class="field-group">
            <label>Duración (Minutos) *</label>
            <select formControlName="duracionBloque">
              <option [value]="15">15 min</option>
              <option [value]="30">30 min</option>
              <option [value]="45">45 min</option>
              <option [value]="60">60 min</option>
            </select>
          </div>
          <div class="field-group">
            <label>Motivo / Especialidad *</label>
            <select formControlName="tipo">
              <option value="CONSULTA_GENERAL">Consulta General</option>
              <option value="ORTODONCIA">Ortodoncia</option>
              <option value="ENDODONCIA">Endodoncia</option>
              <option value="ESTETICA">Estética Dental</option>
              <option value="CIRUGIA">Cirugía Oral</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Comentarios y Notificaciones</h3>
        <div class="field-group">
          <label>Motivo de atención / Notas para el paciente</label>
          <textarea formControlName="notas" rows="2" placeholder="Visible para el paciente en recordatorios"></textarea>
        </div>
        <div class="field-group mt-4">
          <label>Comentario Interno (Solo Clínica)</label>
          <textarea formControlName="comentarioInterno" rows="2" placeholder="Notas administrativas o técnicas"></textarea>
        </div>
        <div class="field-group mt-4">
          <label class="checkbox-item">
            <input type="checkbox" formControlName="notificarPaciente">
            <span>Notificar al paciente vía Email / WhatsApp</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoadingForm">
          <span *ngIf="!isLoadingForm">Confirmar Cita</span>
          <span *ngIf="isLoadingForm" class="spinner"></span>
        </button>
      </div>
    </form>
  </div>
</div>
