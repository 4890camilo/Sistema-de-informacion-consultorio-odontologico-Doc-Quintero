spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/docquintero}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:docquintero}
server.port=${PORT:8080}

app.jwt.secret=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong
app.jwt.expiration=86400000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs